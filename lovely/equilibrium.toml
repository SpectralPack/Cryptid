[patches.pattern]
target = '=[SMODS _ "src/utils.lua"]'
pattern = "create_shop_card_ui(card, 'Voucher', G.shop_vouchers)"
position = "at"
payload = '''create_shop_card_ui(card, (card.config.center.set == 'Default' or card.config.center.set == 'Enhanced' or card.config.center.key == 'c_base') and 'Base' or card.config.center.set, G.shop_vouchers)
if card.config.center.key == 'j_cry_universe' or card.ability.name == 'cry-universe' then card:set_edition('e_cry_astral', true, nil, true) end
if card.config.center.key == 'j_cry_meteor' or card.ability.name == 'cry-meteor' then card:set_edition('e_foil', true, nil, true) end
if card.config.center.key == 'j_cry_exoplanet' or card.ability.name == 'cry-exoplanet' then card:set_edition('e_holo', true, nil, true) end
if card.config.center.key == 'j_cry_stardust' or card.ability.name == 'cry-stardust' then card:set_edition('e_polychrome', true, nil, true) end
if Cryptid and Cryptid.manipulate then Cryptid.manipulate(card) end'''
match_indent = true

# non-voucher front card in bonus voucher shop slots (game.lua)
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "G.shop_vouchers.T.y, G.CARD_W, G.CARD_H, G.P_CARDS.empty, G.P_CENTERS[G.GAME.current_round.cry_bonusvouchers[i]],{bypass_discovery_center = true, bypass_discovery_ui = true})"
position = "at"
payload = "G.shop_vouchers.T.y, G.CARD_W, G.CARD_H, (G.P_CENTERS[G.GAME.current_round.cry_bonusvouchers[i]].set == 'Default' or G.P_CENTERS[G.GAME.current_round.cry_bonusvouchers[i]].set == 'Enhanced' or G.P_CENTERS[G.GAME.current_round.cry_bonusvouchers[i]].key == 'c_base') and pseudorandom_element(G.P_CARDS, pseudoseed('cry_equifrontbrium'..(G.GAME.round_resets.ante or 1)..(G.GAME.current_round.cry_bonusvouchers[i] or '')..i, G.GAME.pseudorandom.seed)) or G.P_CARDS.empty, G.P_CENTERS[G.GAME.current_round.cry_bonusvouchers[i]],{bypass_discovery_center = true, bypass_discovery_ui = true})"
match_indent = true

# slot tracking for non-booster and non-voucher items purchased from shop slots
[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "if c1.children.buy_button then c1.children.buy_button:remove() end"
position = "after"
payload = '''
    if c1.shop_voucher or c1.from_area == G.shop_vouchers or c1.area == G.shop_vouchers then
        if G.GAME.current_round.voucher and type(G.GAME.current_round.voucher) == 'table' and G.GAME.current_round.voucher.spawn then
            if c1.shop_voucher_idx then
                G.GAME.current_round.voucher.spawn[c1.shop_voucher_idx] = false
            end
            local key = c1.config.center_key or (c1.config.center and c1.config.center.key)
            if key then
                local count = 0
                for _, v in ipairs(G.GAME.current_round.voucher) do
                    if v == key then count = count + 1 end
                end
                if count <= 1 then
                    G.GAME.current_round.voucher.spawn[key] = false
                end
            end
        end
    end
    if c1.shop_cry_bonusvoucher then G.GAME.cry_bonusvouchersused[c1.shop_cry_bonusvoucher] = true end
    if c1.ability and c1.ability.booster_pos then G.GAME.current_round.used_packs[c1.ability.booster_pos] = 'USED' end
'''
match_indent = true